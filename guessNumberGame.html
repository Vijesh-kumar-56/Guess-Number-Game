<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Games</title>
    <style>
        body {
            background-color: #212121;
            color: white;

        }

        .button-style {
            background-color: white;
            width: 550px;
            height: 70px;
            margin-left: 30px;
        }

        .button-style a {
            width: 150px;
            height: 40px;
            border: 1px solid black;
            border-radius: 5px;
            display: inline-block;
            position: relative;
            left: 170px;

            text-align: center;
            line-height: 30px;
            text-decoration: none;
            color: black;
            margin-top: 9px;
            margin-bottom: 9px;
        }

        .container {
            background-color: gray;
            height: 550px;
            width: 550px;
            margin-left: 30px;
        }

        /* Pragh styling */
        .pragh-one,
        h1,
        .pragh-two {
            margin-left: 100px;
            padding-top: 10px;
        }

        h2 {
            margin-left: 135px;
            margin-top: 45px;
            font-size: xx-large;
        }

        .input-button {
            height: 70px;
            margin-left: 155px;
        }

        .input-button input {
            width: 200px;
            height: 36px;
            border-radius: 4px;
            border: none;

        }

        .submit-button {
            margin-left: 160px;
            width: 185px;
            height: 39px;
            background-color: #212121;
            color: white;
            text-align: center;
            padding: 9px;
        }

        .remaining-guess,
        .previous-guess {
            margin-left: 180px;
            padding-top: 20px;
        }

        .remaining-guess input,
        .previous-guess input {
            width: 30px;
            margin-left: 5px;
        }
    </style>
</head>

<body>
    <div class="button-style">
        <a class="home-button" href="index.html">Home</a>
        <a class="linkedin-button" href="https://www.linkedin.com/in/vijesh-kumar-536a79329" target="_blank">
            LinkedIn
        </a>
    </div>
    <h1>Number Guessing Games</h1>
    <div class="container">
        <p class="pragh-one">Try and guess a random number between 1 to 100.</p>
        <p class="pragh-two">You hav 10 attempts to guess the right number.</p>

        <h2>Guess a Number</h2>
        <div class="input-button">
            <input type="text">
        </div>

        <button class="submit-button">Submit guess</button>

        <div class="previous-guess">
            <label>Previous Guesse</label><input type="text">
        </div>
        <div class="remaining-guess">
            <label>Remaining Guesse</label><input type="text">
        </div>

    </div>
</body>

</html>
